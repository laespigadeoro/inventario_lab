{% extends 'base.html' %}{% block title %}{{ 'Editar' if articulo else 'Nuevo' }} artículo · Inventario Lab{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow">INVENTARIO</p><h1>{{ 'Editar artículo' if articulo else 'Registrar artículo' }}</h1><p class="muted">Los campos marcados con * son obligatorios.</p></div><a class="btn light" href="{{ url_for('articulos') }}">← Volver</a></div><section class="panel form-panel"><form method="post" class="form-grid"><label>Código interno *<input name="codigo" required value="{{ articulo.codigo if articulo else '' }}" placeholder="Ej. PC-001"></label><label>Descripción *<input name="descripcion" required value="{{ articulo.descripcion if articulo else '' }}" placeholder="Ej. Computadora de escritorio"></label><label>Marca<input name="marca" value="{{ articulo.marca if articulo else '' }}"></label><label>Modelo<input name="modelo" value="{{ articulo.modelo if articulo else '' }}"></label><label>Número de serie<input name="serie" value="{{ articulo.serie if articulo else '' }}"></label><label>Cantidad *<input name="cantidad" type="number" min="0" required value="{{ articulo.cantidad if articulo else 1 }}"></label><label>Categoría *<select name="categoria_id" required><option value="">Seleccionar</option>{% for c in categorias %}<option value="{{ c.id }}" {{ 'selected' if articulo and articulo.categoria_id==c.id }}>{{ c.nombre }}</option>{% endfor %}</select></label><label>Ubicación *<select name="ubicacion_id" required><option value="">Seleccionar</option>{% for u in ubicaciones %}<option value="{{ u.id }}" {{ 'selected' if articulo and articulo.ubicacion_id==u.id }}>{{ u.nombre }}</option>{% endfor %}</select></label><label>Estado *<select name="estado" required>{% for e in estados %}<option {{ 'selected' if (articulo and articulo.estado==e) or (not articulo and e=='Disponible') }}>{{ e }}</option>{% endfor %}</select></label><div class="form-actions"><button class="btn primary">{{ 'Guardar cambios' if articulo else 'Registrar artículo' }}</button><a class="btn light" href="{{ url_for('articulos') }}">Cancelar</a></div></form></section>{% endblock %}
